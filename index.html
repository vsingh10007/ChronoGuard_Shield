<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0a0c10">
    <title>ChronoGuard | Self-Healing Dependency Guardian</title>
    <style>
        :root {
            --bg: #0a0c10;
            --s1: #12151b;
            --s2: #181c24;
            --bd: rgba(255, 255, 255, .09);
            --tx: #e6e9ef;
            --mu: #8b93a1;
            --ac: #14b8a6;
            --nl: #b6bdc9;
            --tb: #000;
            color-scheme: dark
        }

        [data-theme=light] {
            --bg: #eef1f5;
            --s1: #fff;
            --s2: #f1f4f8;
            --bd: rgba(15, 23, 42, .14);
            --tx: #172033;
            --mu: #566174;
            --ac: #0d8f84;
            --nl: #3b4658;
            --tb: #172033;
            color-scheme: light
        }

        [data-theme=light] .btn.p {
            color: #fff
        }

        [data-theme=light] .logo {
            color: #fff
        }

        svg text {
            fill: var(--mu);
            font-size: 10px
        }

        .ok {
            --c: 34, 197, 94
        }

        .wa {
            --c: 245, 158, 11
        }

        .co {
            --c: 249, 115, 22
        }

        .cr {
            --c: 239, 68, 68
        }

        .fa {
            --c: 225, 29, 72
        }

        .in {
            --c: 59, 130, 246
        }

        .ne {
            --c: 107, 114, 128
        }

        .sim {
            --c: 139, 92, 246
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.45 Inter, system-ui, sans-serif
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .app {
            display: grid;
            grid-template-columns: 232px minmax(0, 1fr);
            min-height: 100vh
        }

        aside {
            background: var(--s1);
            border-right: 1px solid var(--bd);
            padding: 16px 12px;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 30
        }

        .brand {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 4px 8px 14px
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--ac);
            color: #04201c;
            display: grid;
            place-items: center;
            font-weight: 800
        }

        .brand small {
            display: block;
            color: var(--mu);
            font-size: 11px
        }

        .grp {
            color: var(--mu);
            font-size: 12px;
            padding: 12px 10px 4px
        }

        .nl {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 9px 10px;
            border-radius: 10px;
            color: var(--nl)
        }

        .nl:hover {
            background: var(--s2)
        }

        .nl.act {
            background: rgba(20, 184, 166, .15);
            color: var(--tx);
            box-shadow: inset 3px 0 var(--ac)
        }

        .env {
            margin-top: auto;
            font-size: 12px;
            color: var(--mu);
            padding: 8px 10px
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px 8px
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -.02em
        }

        .ht p {
            margin: 4px 0 0;
            color: var(--mu)
        }

        .hr {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center
        }

        .mu {
            color: var(--mu)
        }

        .mb {
            display: none
        }

        main {
            padding: 12px 28px 40px;
            outline: 0
        }

        .mono {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 12px
        }

        .card {
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            min-width: 0
        }

        .card h2 {
            margin: 0 0 4px;
            font-size: 16px
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 14px
        }

        .kpi {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .kpi span {
            color: var(--mu);
            font-size: 13px
        }

        .kpi b {
            font-size: 26px;
            line-height: 1.2
        }

        .kpi small {
            color: var(--mu)
        }

        .g2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 14px
        }

        .b {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 2px 9px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            color: rgb(var(--c, 107, 114, 128));
            background: rgba(var(--c, 107, 114, 128), .16);
            white-space: nowrap
        }

        .b.fa {
            outline: 1px dashed rgb(var(--c))
        }

        .btn {
            background: var(--s2);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 9px;
            padding: 7px 12px;
            font: inherit;
            cursor: pointer;
            display: inline-flex;
            gap: 6px;
            align-items: center
        }

        .btn:hover {
            border-color: var(--ac)
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .btn.p {
            background: var(--ac);
            color: #04201c;
            border-color: var(--ac);
            font-weight: 700
        }

        :focus-visible {
            outline: 2px solid #5eead4;
            outline-offset: 2px
        }

        input,
        select {
            background: var(--bg);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 9px;
            padding: 7px 10px;
            font: inherit;
            min-width: 0
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px
        }

        .tools input[type=search] {
            flex: 1;
            min-width: 200px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .chip {
            border: 1px dashed var(--bd);
            background: none;
            color: var(--mu);
            border-radius: 99px;
            padding: 4px 12px;
            cursor: pointer;
            font: inherit
        }

        .chip.on {
            border: 1px solid var(--ac);
            color: var(--ac);
            background: rgba(20, 184, 166, .1)
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            padding: 9px 10px;
            text-align: left;
            border-bottom: 1px solid var(--bd);
            vertical-align: top
        }

        th {
            color: var(--mu);
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap
        }

        td {
            min-width: 80px
        }

        .th {
            background: none;
            border: 0;
            color: inherit;
            font: inherit;
            cursor: pointer;
            padding: 0
        }

        tr[data-a] {
            cursor: pointer
        }

        .row {
            background: rgba(var(--c), .1)
        }

        .row td:first-child {
            box-shadow: inset 3px 0 rgb(var(--c))
        }

        .bn {
            padding: 9px 28px;
            font-weight: 600;
            color: rgb(var(--c));
            background: rgba(var(--c), .14);
            border-block: 1px solid rgba(var(--c), .3)
        }

        .ctr {
            text-align: center;
            padding: 36px 16px
        }

        .cnt {
            margin: 2px 0 8px;
            font-size: 12px
        }

        .pg {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            margin-top: 10px
        }

        .lc {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .st {
            flex: 1;
            min-width: 130px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 10px;
            background: var(--s2)
        }

        .st small {
            display: block;
            color: var(--mu);
            margin: 4px 0
        }

        .sw {
            width: 46px;
            height: 26px;
            border-radius: 99px;
            border: 0;
            background: #4b5563;
            position: relative;
            cursor: pointer;
            flex: none
        }

        .sw::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: .15s
        }

        .sw[aria-checked=true] {
            background: #16a34a
        }

        .sw[aria-checked=true]::after {
            left: 23px
        }

        .bar {
            height: 8px;
            border-radius: 9px;
            background: var(--s2);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ac)
        }

        dl {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 6px 12px;
            margin: 8px 0
        }

        dt {
            color: var(--mu)
        }

        dd {
            margin: 0;
            word-break: break-word
        }

        .drw {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 50;
            display: flex;
            justify-content: flex-end
        }

        .drw[hidden] {
            display: none
        }

        .dp {
            width: min(520px, 100%);
            background: var(--s1);
            border-left: 1px solid var(--bd);
            padding: 18px;
            overflow: auto
        }

        .dh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px
        }

        .dp h3 {
            margin: 16px 0 4px;
            font-size: 14px;
            color: var(--ac)
        }

        #tst {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 60;
            background: var(--tb);
            color: #fff;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 10px 14px;
            opacity: 0;
            transform: translateY(8px);
            transition: .2s;
            pointer-events: none;
            max-width: 340px
        }

        #tst.on {
            opacity: 1;
            transform: none
        }

        @media(max-width:900px) {
            .app {
                grid-template-columns: 1fr
            }

            aside {
                position: fixed;
                inset: 0 auto 0 0;
                width: 232px;
                transform: translateX(-100%);
                transition: transform .2s
            }

            aside.open {
                transform: none
            }

            .mb {
                display: inline-flex
            }

            header,
            main {
                padding-inline: 16px
            }

            .bn {
                padding-inline: 16px
            }

            dl {
                grid-template-columns: 110px 1fr
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside id="sb">
            <div class="brand">
                <div class="logo">CG</div>
                <div><b>ChronoGuard</b><small>Self-Healing Dependency Guardian</small></div>
            </div>
            <nav id="nav" aria-label="Main"></nav>
            <div class="env" id="env"></div>
        </aside>
        <div>
            <header>
                <div style="display:flex;gap:10px;align-items:center"><button class="btn mb" data-a="menu"
                        aria-label="Open menu">☰</button>
                    <div class="ht">
                        <h1 id="t"></h1>
                        <p id="d"></p>
                    </div>
                </div>
                <div class="hr"><span class="b" id="cn">API: checking</span><span class="b" id="mp"></span><span
                        class="mu" id="lr">Not refreshed yet</span><button class="btn" data-a="rf">⟳
                        Refresh</button><button class="btn" id="th" data-a="th" aria-label="Switch to light mode">☀
                        Light mode</button><label class="btn"><input type="checkbox" id="dm"> Demo data</label></div>
            </header>
            <div id="bn"></div>
            <main id="v" tabindex="-1"></main>
        </div>
    </div>
    <div class="drw" id="drw" hidden>
        <div class="dp" id="dp" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div>
    </div>
    <div id="tst" role="status" aria-live="polite"></div>
    <script>
        /* API contract used (see section 8 of the master prompt): GET /api/health, /api/monitor/status, /api/servers, /api/servers/{id}/health-history,
           /api/overview, /api/incidents, /api/requests(+/stats, /{id}, /{id}/history), /api/logs, /api/simulations; PUT /api/monitor/config {enabled};
           POST /api/monitor/check, /api/simulations/floods, /api/simulations/{id}/stop, /api/simulations/validation-suites/{suite}/run {case,payload},
           /api/simulations/resilience/{scenario}, /api/simulations/reset. List responses: array or {data|items:[],meta:{total}}. */
        const $ = (s, e = document) => e.querySelector(s), esc = s => String(s ?? '—').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const get = (o, ...k) => { for (const x of k) if (o && o[x] != null && o[x] !== '') return o[x]; return null };
        const f = v => v == null || v === '' ? '—' : esc(v), na = '<span class="mu">Not Available</span>';
        const list = r => Array.isArray(r) ? r : Array.isArray(r?.data) ? r.data : r?.items || [], mt = r => r?.meta?.total ?? r?.total ?? null;
        const ts = v => { if (!v) return '—'; const d = new Date(v); return isNaN(d) ? esc(v) : `<time title="${d.toISOString()} (UTC)">${d.toLocaleString()}</time>` };
        const qs = o => { const p = new URLSearchParams(Object.entries(o).filter(([, v]) => v !== '' && v != null)); return p.toString() ? '?' + p : '' };
        const red = o => o == null ? null : JSON.stringify(o, (k, v) => /pass|secret|token|api.?key|cred/i.test(k) ? '[redacted]' : v), sh = (s, n = 44) => s && s.length > n ? s.slice(0, n) + '…' : s;
        const opt = (a, c) => a.map(([v, l]) => `<option value="${v}"${v == c ? ' selected' : ''}>${l}</option>`).join('');
        const pl = (t, k) => `<span class="b ${k}">${esc(t)}</span>`;
        const hk = s => /^(healthy|ok|up|ready|available|verified)/i.test(s) ? 'ok' : /degraded|warn/i.test(s) ? 'wa' : /unhealthy|down|fail|crit/i.test(s) ? 'cr' : 'ne', hp = s => pl(s ?? 'Unknown', hk(s));
        const sv = s => /crit|high/i.test(s) ? 'cr' : /warn|med/i.test(s) ? 'wa' : /low|info/i.test(s) ? 'in' : 'ne';
        const K = { SUCCESS: 'ok', CORRECTED: 'co', REJECTED: 'cr', FAILED: 'fa', QUARANTINED: 'ne', PENDING: 'in', UNKNOWN: 'ne' }, IC = { SUCCESS: '✓', CORRECTED: '✎', REJECTED: '✕', FAILED: '!', QUARANTINED: '⚿', PENDING: '…', UNKNOWN: '?' };
        const RS = s => { s = String(s || '').toUpperCase().replace(/[ -]/g, '_'); return K[s] && s !== 'PENDING' ? s : /^(PENDING|RECEIVED|VALIDATING|PROCESSING|AWAITING_RETRY|VERIFICATION_PENDING)$/.test(s) ? 'PENDING' : 'UNKNOWN' };
        const rp = s => `<span class="b ${K[s]}">${IC[s]} ${s}</span>`, rst = r => RS(get(r, 'final_status', 'processing_status', 'status'));
        const kpi = (l, v, s = '') => `<div class="card kpi"><span>${l}</span><b>${v == null ? na : esc(v)}</b><small>${s}</small></div>`;
        const kv = a => `<dl>${a.map(([k, v]) => `<dt>${k}</dt><dd>${v == null || v === '' ? '—' : v}</dd>`).join('')}</dl>`;
        const errBox = (t, m) => `<div class="card ctr"><b>${esc(t)}</b><p class="mu">${esc(m)}</p><button class="btn" data-a="rf">Retry</button></div>`, empty = m => `<div class="ctr mu">${m}</div>`;
        const view = h => { $('#v').innerHTML = h };
        const table = (cols, rows) => `<div class="tw"><table><thead><tr>${cols.map(c => Array.isArray(c) ? `<th><button class="th" data-a="rsort" data-k="${c[1]}">${c[0]}${S.q.sort == c[1] ? S.q.order == 'asc' ? ' ▲' : ' ▼' : ''}</button></th>` : `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
        const pager = (p, tot, n, a) => { const m = Math.max(1, Math.ceil((tot || 0) / n)); return `<div class="pg"><span class="mu">Page ${p} of ${m}</span><button class="btn" data-a="${a}" data-p="${p - 1}" ${p <= 1 ? 'disabled' : ''}>Prev</button><button class="btn" data-a="${a}" data-p="${p + 1}" ${p >= m ? 'disabled' : ''}>Next</button></div>` };
        function toast(m, bad) { const t = $('#tst'); t.textContent = m; t.style.borderColor = bad ? '#ef4444' : '#14b8a6'; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3800) }
        let opener; function drawer(title, h) { opener = document.activeElement; $('#dp').innerHTML = `<div class="dh"><b>${title}</b><button class="btn" data-a="dx" aria-label="Close details">✕</button></div>${h}`; $('#drw').hidden = false; $('#dp').focus() }
        function closeDr() { $('#drw').hidden = true; opener?.focus?.() }

        /* ---------- demo data (clearly labelled; only used when "Demo data" is on) ---------- */
        const NOW = Date.now(), iso = m => new Date(NOW - m * 6e4).toISOString(), D = { mon: true, last: iso(0) };
        D.req = [['CG-1001', 'CORRECTED', 'Missing timezone information', '2026-10-26 10:30:00', '2026-10-26T10:30:00Z', 'Naive timestamp normalized to UTC (demo policy)'], ['CG-1002', 'REJECTED', 'Invalid timestamp format', 'not-a-valid-timestamp', null, 'Timestamp cannot be parsed safely'], ['CG-1003', 'SUCCESS'], ['CG-1004', 'SUCCESS'], ['CG-1005', 'REJECTED', 'Missing required field: email'], ['CG-1006', 'PENDING'], ['CG-1007', 'SUCCESS'], ['CG-1008', 'FAILED', 'Processing failed after validation'], ['CG-1009', 'CORRECTED', 'Email whitespace trimmed', ' a@b.co ', 'a@b.co', 'Trim policy'], ['CG-1010', 'SUCCESS'], ['CG-1011', 'UNKNOWN'], ['CG-1012', 'SUCCESS']].map((r, i) => ({ request_id: r[0], received_at: iso(i * 7 + 2), updated_at: iso(i * 7 + 1), original_payload: { name: 'Demo', email: 'user@example.com', timestamp: r[3] || '2026-10-26T10:30:00Z' }, validation_status: r[1] == 'REJECTED' ? 'FAILED' : 'PASSED', detected_issue: r[2] || null, correction_applied: r[1] == 'CORRECTED', original_value: r[3] || null, corrected_value: r[4] || null, correction_reason: r[5] || null, rejection_reason: r[1] == 'REJECTED' ? r[5] || r[2] : null, final_status: r[1], processing_server: /REJ|PEN/.test(r[1]) ? null : 'Server A', verification_status: /^(SUCCESS|CORRECTED)$/.test(r[1]) ? 'VERIFIED' : null, origin: i == 5 || i == 10 ? 'simulation' : 'operational' }));
        D.logs = [...D.req.map((r, i) => ({ id: 'EV-' + (i + 10), timestamp: r.updated_at, category: { CORRECTED: 'correction', REJECTED: 'rejection', FAILED: 'validation' }[r.final_status] || 'validation', severity: /REJ|FAIL/.test(r.final_status) ? 'warning' : 'info', source: 'request-guardian', request_id: r.request_id, action: 'Request processed', outcome: r.final_status, message: r.detected_issue || 'Request validated', origin: r.origin })), ...[1, 6, 11].map((m, i) => ({ id: 'EV-' + i, timestamp: iso(m), category: 'health_check', severity: 'info', source: 'monitor', server: 'Server A', action: 'Scheduled check', outcome: 'healthy', message: 'Health check passed', origin: 'operational' }))].sort((a, b) => b.timestamp.localeCompare(a.timestamp));
        D.servers = [{ id: 'a', name: 'Server A', role: 'primary', health: 'healthy', readiness: 'ready', last_check_at: iso(1), consecutive_failures: 0, response_ms: 42, active: true }, { id: 'b', name: 'Server B', role: 'backup', health: 'healthy', readiness: 'ready', last_check_at: iso(1), consecutive_failures: 0, response_ms: 55, active: false }];
        D.hist = [1, 2, 3, 4].map(m => ({ checked_at: iso(m), result: 'pass', response_ms: 40 + m, failure_count: 0, error: null, state: 'healthy', check_type: 'scheduled' }));
        D.inc = [{ incident_id: 'INC-1', detected_at: iso(40), title: 'Repeated health-check failures', server: 'Server A', severity: 'critical', source: 'monitor', status: 'Recovering', recovery_result: 'Pending', origin: 'simulation' }, { incident_id: 'INC-2', detected_at: iso(300), title: 'Request validation failure', server: 'Server A', severity: 'warning', source: 'request-guardian', status: 'Resolved', recovery_result: 'Verified', origin: 'operational' }];
        D.sims = [{ id: 'SIM-1', name: 'Email validation suite', category: 'validation', started_at: iso(20), completed_at: iso(19), requests_attempted: 8, expected: '8 pass', actual: '8 pass', passed: true }];
        const em = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
        function vd(p) {
            const e = []; let fix = null; if (p.name == null || p.name === '') e.push('name required'); const m = p.email;
            if (m == null || m === '') e.push('email required'); else if (typeof m !== 'string') e.push('email must be a string'); else if (!em.test(m.trim())) e.push('email malformed'); else if (m !== m.trim()) fix = 'email trimmed';
            const t = p.timestamp; if (t == null || t === '') e.push('timestamp required'); else if (typeof t !== 'string') e.push('timestamp must be a string'); else {
                const x = t.match(/^(\d{4})-(\d\d)-(\d\d)[T ]\d\d:\d\d:\d\d(\.\d+)?(Z|[+-]\d\d:\d\d)?$/);
                if (!x) e.push('timestamp unparseable'); else { const d = new Date(Date.UTC(+x[1], x[2] - 1, +x[3])); if (d.getUTCMonth() != x[2] - 1 || d.getUTCDate() != +x[3]) e.push('timestamp invalid calendar date'); else if (!x[5]) fix = 'timestamp normalized to UTC (demo policy)' }
            }
            return { final_status: e.length ? 'REJECTED' : fix ? 'CORRECTED' : 'SUCCESS', message: e.join('; ') || fix || 'Passed validation', request_id: 'CG-T' + Math.floor(Math.random() * 9e3 + 1e3) }

            mc: async () => { try { await api('/api/monitor/check', { method: 'POST' }); toast('Manual health check completed') } catch (e) { toast(e.message, 1) } refresh() },
            fs: async () => {
                const d = Object.fromEntries(new FormData($('#ff'))); const b = { count: +d.count, rate: +d.rate, type: d.type, concurrency: +d.conc }; if (b.count >= 250 && !confirm(`Start a ${b.count}-request flood against the local test API?`)) return;
                try { S.fl = await api('/api/simulations/floods', { method: 'POST', body: b }); S.fl.count = S.fl.count || b.count; floodRender(); pollFl() } catch (e) { toast(e.message, 1) }
            },
            fx: async () => { const id = get(S.fl, 'id', 'test_id'); if (!id) return toast('No active test.', 1); try { await api(`/api/simulations/${encodeURIComponent(id)}/stop`, { method: 'POST' }); toast('Stop requested'); pollFl() } catch (e) { toast(e.message, 1) } },
            fc: () => { clearTimeout(S.pt); S.fl = null; floodRender() },
            su: b => { S.suite = b.dataset.v; pSim() }, sc: async b => { b.disabled = true; await runCase(+b.dataset.i); suiteRender() },
            sa: async () => { for (let i = 0; i < SU[S.suite].length; i++)await runCase(i); suiteRender() },
            rs2: async b => {
                const k = b.dataset.v; if (k != 'reset' && !confirm('Run this SIMULATED fault? It affects simulation state only.')) return; try {
                    const r = await api(k == 'reset' ? '/api/simulations/reset' : '/api/simulations/resilience/' + k, { method: 'POST' });
                    $('#rr').innerHTML = kv(Object.entries(r.data || r).filter(([, v]) => typeof v != 'object').map(([a, v]) => [esc(a), f(v)])) || ''; toast('Backend responded')
                } catch (e) { $('#rr').innerHTML = `<p class="mu">${esc(e.message)}</p>`; toast(e.message, 1) }
            }
        };
        document.addEventListener('click', e => { const n = e.target.closest('a[data-p]'); if (n) { e.preventDefault(); if (FILE) location.hash = n.dataset.p; else go(n.dataset.p); return } const a = e.target.closest('[data-a]'); if (a) ACT[a.dataset.a]?.(a) });
        document.addEventListener('keydown', e => { if (e.key == 'Escape') closeDr(); if (e.key == 'Enter' && e.target.matches('tr[data-a]')) e.target.click() });
        $('#drw').addEventListener('click', e => { if (e.target.id == 'drw') closeDr() });
        document.addEventListener('change', e => { const t = e.target; if (t.id == 'dm') { S.demo = t.checked; S.res = {}; S.fl = null; return render() } if (t.matches('#iq,#is,#ist')) return tInc(); const d = t.dataset.f; if (!d) return; const [o, k] = d.split('.'); S[o][k] = t.value; S[o].page = 1; o == 'q' ? pReq() : pLog() });
        document.addEventListener('input', e => { if (e.target.matches('#iq')) tInc() });
        addEventListener('popstate', render); addEventListener('hashchange', render);
        setInterval(() => { if (!document.hidden && !S.busy && $('#drw').hidden && !document.activeElement?.matches('input,select') && cur() != 'simulation-lab') refresh() }, 20000);
        let t0 = 'dark'; try { t0 = localStorage.getItem('cg-theme') || 'dark' } catch { } setTheme(t0);
        render();
    </script>
</body>
